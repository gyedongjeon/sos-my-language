[project]
name = "sos-my-language-backend"
version = "0.4.0"
license = "MIT"
# Raise the upper bound only once every locked package has wheels for the new Python
# (onnxruntime had none for 3.15). The Python actually used is pinned in .python-version.
requires-python = ">=3.12,<3.15"
dependencies = [
    # faster-whisper 1.2 passes an av.open() argument that PyAV 17+ removed.
    "av<17",
    "certifi>=2026.10.23",
    "fastapi>=0.115",
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "litellm>=1.110.2",
    "piper-tts>=1.8.0",
    "python-multipart>=0.0.34",
    # LiteLLM retries failed requests with tenacity but does not depend on it.
    "supertonic>=1.3.1",
    "tenacity>=9.2.1",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.30",
    "youtube-transcript-api>=1.2",
    "yt-dlp>=2026.10.26",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls a real LLM; needs a provider API key (run with `pytest -m live`)"]
# Tests that call a real LLM are left out unless asked for with `-m live`.
addopts = "-m 'not live'"
